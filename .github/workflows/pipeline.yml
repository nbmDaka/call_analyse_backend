name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        run: go build ./...

      - name: Build Docker image
        run: docker build --tag call-analyse-backend:test .

  deploy:
    name: Deploy to VPS
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -p "${DEPLOY_PORT:-9865}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
            set -eu
            cd /home/nurdaulet/apps/call-analyse-backend
            git pull --ff-only origin main
            if ! docker compose up -d --build; then
              docker compose ps -a
              docker compose logs --tail=200 migrate api worker
              exit 1
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:18080/health/live; then
                exit 0
              fi
              sleep 2
            done

            docker compose ps -a
            docker compose logs --tail=200 api worker migrate
            exit 1
          REMOTE
